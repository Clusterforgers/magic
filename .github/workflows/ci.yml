name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://magic:magic@localhost:5432/magic
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: magic
          POSTGRES_PASSWORD: magic
          POSTGRES_DB: magic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Regenerates the query metadata against a freshly migrated database; any diff means `.sqlx/` is stale.
      - name: Check .sqlx is current
        run: |
          psql "postgres://magic:magic@localhost:5432/postgres" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE sqlx_check"
          for migration in crates/mtg-db/migrations/*.sql; do
            psql "postgres://magic:magic@localhost:5432/sqlx_check" -v ON_ERROR_STOP=1 -q -f "$migration"
          done
          touch crates/mtg-db/src/lib.rs
          SQLX_OFFLINE=false SQLX_OFFLINE_DIR="$PWD/.sqlx" DATABASE_URL=postgres://magic:magic@localhost:5432/sqlx_check cargo check -p mtg-db
          git diff --exit-code --stat -- .sqlx
          test -z "$(git status --porcelain -- .sqlx)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
