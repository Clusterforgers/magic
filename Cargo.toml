[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mtg-core = { path = "crates/mtg-core" }
mtg-engine = { path = "crates/mtg-engine" }
mtg-cards = { path = "crates/mtg-cards" }
mtg-import = { path = "crates/mtg-import" }
mtg-db = { path = "crates/mtg-db" }
mtg-protocol = { path = "crates/mtg-protocol" }
mtg-testkit = { path = "crates/mtg-testkit" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
rstest = "0.26"
serde_json = "1"
proptest = "1"
roxmltree = "0.21"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "json",
    "uuid",
    "chrono",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
