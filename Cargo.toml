[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mtg-core = { path = "crates/mtg-core" }
mtg-engine = { path = "crates/mtg-engine" }
mtg-cards = { path = "crates/mtg-cards" }
mtg-import = { path = "crates/mtg-import" }
mtg-db = { path = "crates/mtg-db" }
mtg-protocol = { path = "crates/mtg-protocol" }
mtg-testkit = { path = "crates/mtg-testkit" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
rstest = "0.26"
serde_json = "1"
proptest = "1"
rand_chacha = "0.10"
rand_core = "0.10"
roxmltree = "0.21"
unicode-normalization = "0.1"
chrono ={ version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "json",
    "uuid",
    "chrono",
] }
flate2 = "1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
getrandom = "0.4"
# Exact pins: password hashing is not a place for a surprise upgrade.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Fuzz games play thousands of full games; optimising only the crates involved keeps debug test runs fast.
[profile.dev.package.mtg-core]
opt-level = 3
[profile.dev.package.mtg-engine]
opt-level = 3
[profile.dev.package.mtg-testkit]
opt-level = 3
