services:
  db:
    image: postgres:17
    # A local development database: without fsync every `sqlx::test` database is created and dropped in milliseconds, not a forced checkpoint each.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: magic
      POSTGRES_DB: magic
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic"]
      interval: 5s
      retries: 10

volumes:
  db-data:
